<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Register</title>
    
</head>

<body class="auth-page">
    <div class="container">
        <div class="form-container" id="registerForm">
            <div class="success-message" id="registerSuccess"></div>
            <h2>Create Account</h2>
            <form id="register">
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName" placeholder="Enter your full name">
                    <span class="error-message" id="registerNameError"></span>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" placeholder="Enter your email">
                    <span class="error-message" id="registerEmailError"></span>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Enter your password">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="password-strength-text" id="strengthText"></div>
                    <span class="error-message" id="registerPasswordError"></span>
                </div>
                <div class="form-group">
                    <label for="registerConfirmPassword">Confirm Password</label>
                    <input type="password" id="registerConfirmPassword" placeholder="Re-enter your password">
                    <span class="error-message" id="registerConfirmPasswordError"></span>
                </div>
                <button type="submit" class="btn">Sign Up </button>
            </form>
            <div class="switch-form">
                Already have an account?
                <a href="../Login/Login.html">Login here</a>
            </div>

        </div>
    </div>
    
    <script src="/utils.js"></script>  
    <script src="/Auth/JS/script.js"></script>

</body>

</html>
